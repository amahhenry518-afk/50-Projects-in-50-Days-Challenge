<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-container">
    <h1>BMI Calculator</h1>
    
    <div class="input-group">
      <label for="height">Height (cm):</label>
      <input type="number" id="height" placeholder="e.g. 175" required>
    </div>

    <div class="input-group">
      <label for="weight">Weight (kg):</label>
      <input type="number" id="weight" placeholder="e.g. 70" required>
    </div>

    <button id="calculate-btn">Calculate BMI</button>

    <div id="result-container">
      <h3>Your BMI: <span id="bmi-value">--</span></h3>
      <p id="bmi-category">Enter your details to see your status.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
