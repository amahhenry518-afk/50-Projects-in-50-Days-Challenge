<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <h2>My To-Do List</h2>
        <div class="todo-input-section">
            <input type="text" placeholder="Add a new task..." disabled>
            <button type="button" disabled>+</button>
        </div>
        <ul class="todo-list">
            <li>
                <label>
                    <input type="checkbox">
                    <span class="task-text">Buy groceries</span>
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox" checked>
                    <span class="task-text">Finish homework (Completed)</span>
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox">
                    <span class="task-text">Clean the room</span>
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox">
                    <span class="task-text">Read a book chapter</span>
                </label>
            </li>
        </ul>
    </div>

</body>
</html>
