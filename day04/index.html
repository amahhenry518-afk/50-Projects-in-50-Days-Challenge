<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-container">
        <!-- Title Header -->
        <div class="calculator-header">Calculator</div>
        
        <!-- Display Screen Area -->
        <div class="screen-container">
            <input type="text" class="display-screen" disabled>
        </div>

        <!-- Button Grid Layout -->
        <div class="button-grid">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">/</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">*</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">-</button>

            <button>0</button>
            <button class="clear">C</button>
            <button class="equal">=</button>
            <button class="operator">+</button>
        </div>
    </div>

</body>
</html>
